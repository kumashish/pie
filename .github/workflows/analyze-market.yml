name: Analyze Market

concurrency:
  group: market-analysis
  cancel-in-progress: false

on:
  schedule:
    # Every hour from 10:20 AM to 3:20 PM IST (Mon-Fri)
    - cron: "50 4-9 * * 1-5"

  workflow_dispatch:
    inputs:
      symbol:
        description: Yahoo Finance symbol (leave blank to use configured symbols)
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  analyze-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Update NSE most active symbols
        run: |
          python - <<'PY'
          import os, re, urllib.request, json
          def fetch_active_symbols(output_path=None, limit=10):
              url = "https://www.nseindia.com/market-data/most-active-underlying"
              headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9",
              }
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")
              except Exception as e:
                  print(f"[Warning] Failed to fetch NSE active symbols: {e}")
                  return []
              candidates = re.findall(r">\\s*([A-Z]{2,5})\\s*</a>", html)
              seen = set()
              symbols = []
              for sym in candidates:
                  if sym not in seen:
                      seen.add(sym)
                      symbols.append(sym)
                  if len(symbols) >= limit:
                      break
              symbols_ns = [f"{s}.NS" for s in symbols]
              if not output_path:
                  output_path = os.path.join(os.path.dirname(__file__), "..", "config", "market_symbols.txt")
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(symbols_ns))
              print(f"[Info] Wrote {len(symbols_ns)} active symbols to {output_path}")
              return symbols_ns
          if __name__ == "__main__":
              fetch_active_symbols()
          PY

      - name: Analyze market
        shell: bash
        run: |
          set -euo pipefail

          analyze_symbol() {
            local SYMBOL="$1"

            echo "::group::${SYMBOL}"

            for ATTEMPT in 1 2 3; do
              echo "Attempt ${ATTEMPT}/3"

              if uv run pie analyze-market "${SYMBOL}"; then
                echo "::endgroup::"
                return 0
              fi

              if [ "$ATTEMPT" -lt 3 ]; then
                echo "Retrying in 15 seconds..."
                sleep 15
              fi
            done

            echo "::error::Failed to analyze ${SYMBOL}"
            echo "::endgroup::"

            return 1
          }

          if [ -n "${{ inputs.symbol }}" ]; then
            echo "Running analysis for manually supplied symbol..."
            SYMBOLS="${{ inputs.symbol }}"

          elif [ -f config/market_symbols.txt ]; then
            echo "Using symbols from config/market_symbols.txt"

            SYMBOLS=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' config/market_symbols.txt)

          else
            echo "No config/market_symbols.txt found."
            echo "Using default symbols: ^NSEI ^NSEBANK"

            SYMBOLS="^NSEI ^NSEBANK"
          fi

          FAILED_SYMBOLS=""

          for SYMBOL in $SYMBOLS; do
            if ! analyze_symbol "$SYMBOL"; then
              FAILED_SYMBOLS="${FAILED_SYMBOLS} ${SYMBOL}"
            fi
          done

          FAILED_SYMBOLS="$(echo "$FAILED_SYMBOLS" | xargs || true)"

          if [ -n "$FAILED_SYMBOLS" ]; then
            echo "FAILED_SYMBOLS=$FAILED_SYMBOLS" >> "$GITHUB_ENV"
          fi

      - name: Follow high‑conviction signals
        if: always()
        run: |
          python - <<'PY'
          import json, os, subprocess
          path = os.path.join(os.path.dirname(__file__), '..', '..', 'pie', 'reporting', 'high_score_signals.json')
          try:
            with open(path, 'r', encoding='utf-8') as f:
                data = json.load(f)
          except FileNotFoundError:
            data = []
          open_symbols = [item['symbol'] for item in data if item.get('status') == 'open']
          if not open_symbols:
            print('No open high‑conviction alerts.')
          else:
            print('Following open high‑conviction alerts:', open_symbols)
            for sym in open_symbols:
                subprocess.run(['uv', 'run', 'pie', 'analyze-market', sym], check=False)
          PY

      - name: Update README snapshot
        run: uv run pie readme update-readme-snapshot

      - name: Commit and push market reports
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add reports/market state README.md
          
          if git diff --cached --quiet; then
              echo "No report changes."
              exit 0
          fi
          
          git commit -m "chore: update market reports and README snapshot"        
          git push origin HEAD:main || echo "Push failed (likely due to a concurrent update). Changes will be regenerated on the next scheduled run."

      - name: Report failed symbols
        if: env.FAILED_SYMBOLS != ''
        run: |
          echo "::warning::Market analysis failed for:"
          echo "${FAILED_SYMBOLS}"
