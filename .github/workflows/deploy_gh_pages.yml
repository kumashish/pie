name: Deploy Option Intelligence Web App to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 01:00 UTC (6:30 AM IST) before Indian/US markets open
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Update Market Snapshot & README
        run: |
          python pie/reporting/readme_update.py

      - name: Pre-compute Web Option Trade Data JSON
        run: |
          python pie/reporting/generate_web_data.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
