<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nifty & BankNifty Option Strategies Matrix | TradeCraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20260824">
  <style>
    .matrix-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 20px 24px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    .back-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .back-link:hover {
      background: rgba(0, 229, 255, 0.2);
    }
    .index-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .index-tab {
      padding: 12px 24px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .index-tab.active {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--accent-cyan);
      color: #ffffff;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
    }
    .regime-summary-card {
      background: var(--gradient-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      font-family: var(--font-heading);
    }
    .strategies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .strategy-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .strategy-card:hover {
      transform: translateY(-3px);
      border-color: var(--border-glow);
      box-shadow: var(--shadow-lg);
    }
    .strategy-card.optimal {
      border-color: rgba(16, 185, 129, 0.5);
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(15, 23, 42, 0.9) 100%);
    }
    .optimal-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      font-size: 10px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .strategy-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .strategy-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }
    .grade-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .grade-Aplus, .grade-A { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.4); }
    .grade-B { background: rgba(0, 229, 255, 0.2); color: var(--accent-cyan); border: 1px solid rgba(0, 229, 255, 0.4); }
    .grade-C { background: rgba(245, 158, 11, 0.2); color: var(--accent-yellow); border: 1px solid rgba(245, 158, 11, 0.4); }
    .grade-D, .grade-F { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    
    .strategy-score-bar-bg {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .strategy-score-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .strategy-rationale {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .strategy-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .strategy-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="matrix-header">
      <div>
        <h1 style="font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: #ffffff;">🎯 NIFTY & BANKNIFTY OPTIONS STRATEGY MATRIX</h1>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Quantitative strategy rank & edge evaluator across all 14 option structures</p>
      </div>
      <a href="index.html" class="back-link">
        <span>← Back to Dashboard</span>
      </a>
    </div>

    <!-- Index Selector Tabs -->
    <div class="index-tabs">
      <button class="index-tab active" data-symbol="^NSEI">🇮🇳 NIFTY 50</button>
      <button class="index-tab" data-symbol="^NSEBANK">🇮🇳 BANK NIFTY</button>
      <button class="index-tab" data-symbol="NIFTY_FIN_SERVICE.NS">🇮🇳 FIN NIFTY</button>
      <button class="index-tab" data-symbol="^NSEMDCP50">🇮🇳 MIDCAP NIFTY</button>
      <button class="index-tab" data-symbol="SPY">🇺🇸 S&P 500 (SPY)</button>
    </div>

    <!-- Index Market State Summary Card -->
    <div class="regime-summary-card" id="index-summary-box">
      <div class="stat-box">
        <span class="stat-label">Spot Price</span>
        <span class="stat-val" id="summary-price">Loading...</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Market Regime</span>
        <span class="stat-val" id="summary-regime" style="color: var(--accent-green);">--</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Trend Score</span>
        <span class="stat-val" id="summary-trend">-- / 10</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">India VIX / Volatility</span>
        <span class="stat-val" id="summary-vix">--%</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Top Optimal Strategy</span>
        <span class="stat-val" id="summary-optimal" style="color: var(--accent-cyan); font-size: 18px;">--</span>
      </div>
    </div>

    <h2 style="font-family: var(--font-heading); font-size: 18px; margin-bottom: 16px; color: #ffffff;">Option Strategy Quantitative Matrix</h2>
    
    <!-- Strategies Cards Grid -->
    <div class="strategies-grid" id="strategies-grid">
      <!-- Rendered dynamically -->
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const indexTabs = document.querySelectorAll(".index-tab");
      let currentSymbol = "^NSEI";

      indexTabs.forEach(tab => {
        tab.addEventListener("click", () => {
          indexTabs.forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          currentSymbol = tab.getAttribute("data-symbol");
          loadIndexMatrix(currentSymbol);
        });
      });

      async function loadIndexMatrix(symbol) {
        const grid = document.getElementById("strategies-grid");
        grid.innerHTML = `<div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-muted);">Evaluating 14 Option Strategies for ${symbol}...</div>`;

        try {
          const res = await fetch(`/api/analyze?symbol=${encodeURIComponent(symbol)}`);
          if (!res.ok) throw new Error("Failed to fetch index analysis");
          const data = await res.json();
          renderMatrix(data);
        } catch (e) {
          // Fallback to static JSON if offline
          const safeSym = symbol.replace("^", "").replace(".NS", "_NS").replace(/\s+/g, "_");
          try {
            const staticRes = await fetch(`data/${safeSym}.json`);
            if (staticRes.ok) {
              const data = await staticRes.json();
              renderMatrix(data);
              return;
            }
          } catch (err) {}
          grid.innerHTML = `<div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--accent-red);">Unable to load matrix data for ${symbol}.</div>`;
        }
      }

      function renderMatrix(data) {
        document.getElementById("summary-price").textContent = (data.symbol.endsWith(".NS") || data.symbol.startsWith("^NSE")) ? `₹${data.last_price.toLocaleString()}` : `$${data.last_price.toLocaleString()}`;
        document.getElementById("summary-regime").textContent = data.regime_display || data.regime;
        document.getElementById("summary-trend").textContent = `${data.trend_score} / 10`;
        document.getElementById("summary-vix").textContent = `${data.vix}%`;
        document.getElementById("summary-optimal").textContent = data.strategy_display;

        const grid = document.getElementById("strategies-grid");
        
        let matrixList = [];
        if (data.strategy_matrix) {
          matrixList = Object.entries(data.strategy_matrix).map(([type, info]) => ({
            type,
            ...info
          }));
        } else {
          // Fallback basic list if matrix not available
          matrixList = [
            { type: data.strategy_type, name: data.strategy_display, score: data.fit_score, grade: data.confidence_grade, rationale: data.recommendation_reason },
            { type: "call_debit_spread", name: "Call Debit Spread", score: 78.5, grade: "A", rationale: "Bullish momentum structure with defined risk profile." },
            { type: "put_debit_spread", name: "Put Debit Spread", score: 45.0, grade: "C", rationale: "Bearish hedge protection structure." },
            { type: "iron_condor", name: "Iron Condor", score: 62.0, grade: "B", rationale: "Range-bound theta decay harvest play." },
            { type: "butterfly", name: "Butterfly Spread", score: 55.0, grade: "C", rationale: "Targeted expiry pinning play." },
            { type: "credit_spread", name: "Credit Spread", score: 72.0, grade: "B", rationale: "Premium collection directional trade." },
            { type: "jade_lizard", name: "Jade Lizard", score: 68.0, grade: "B", rationale: "High IV skew zero-upside risk structure." },
          ];
        }

        matrixList.sort((a, b) => b.score - a.score);

        grid.innerHTML = matrixList.map(item => {
          const isOptimal = item.name.toLowerCase() === data.strategy_display.toLowerCase();
          const scoreBarColor = item.score >= 80 ? "var(--accent-green)" : (item.score >= 60 ? "var(--accent-cyan)" : (item.score >= 40 ? "var(--accent-yellow)" : "var(--accent-red)"));
          
          let riskType = "Defined Risk";
          let riskColor = "rgba(16, 185, 129, 0.2)";
          const stLower = item.type.toLowerCase();
          
          if (stLower.includes("iron_condor") || stLower.includes("butterfly")) {
            riskType = "🛡️ Defined Risk (Delta Neutral)";
            riskColor = "rgba(0, 229, 255, 0.2)";
          } else if (stLower.includes("debit_spread")) {
            riskType = "🛡️ Capped Risk & Max Reward";
            riskColor = "rgba(16, 185, 129, 0.2)";
          } else if (stLower.includes("jade_lizard")) {
            riskType = "🛡️ Zero Upside Risk / Defined Put Risk";
            riskColor = "rgba(245, 158, 11, 0.2)";
          } else if (stLower.includes("naked") || stLower.includes("strangle")) {
            riskType = "⚠️ Undefined Margin Risk";
            riskColor = "rgba(239, 68, 68, 0.2)";
          } else if (stLower.includes("cash_swing")) {
            riskType = "💵 Equity Capital Risk (Stop-Loss)";
            riskColor = "rgba(147, 51, 234, 0.2)";
          }

          return `
            <div class="strategy-card ${isOptimal ? 'optimal' : ''}">
              ${isOptimal ? '<span class="optimal-badge">⭐ Best Fit</span>' : ''}
              <div>
                <div class="strategy-header">
                  <span class="strategy-title">${item.name}</span>
                  <span class="grade-pill grade-${item.grade.replace('+', 'plus')}">${item.grade} (${item.score}%)</span>
                </div>

                <div class="strategy-score-bar-bg">
                  <div class="strategy-score-bar-fill" style="width: ${Math.min(100, Math.max(0, item.score))}%; background: ${scoreBarColor};"></div>
                </div>

                <p class="strategy-rationale">${item.rationale}</p>
              </div>

              <div class="strategy-tags" style="margin-top: 10px;">
                <span class="strategy-tag" style="background: ${riskColor}; font-weight: 700;">${riskType}</span>
                <span class="strategy-tag">Regime: ${data.regime_display}</span>
                <span class="strategy-tag">IV Rank: ${data.vix}%</span>
              </div>
            </div>
          `;
        }).join("");

      }

      loadIndexMatrix(currentSymbol);
    });
  </script>
</body>
</html>
